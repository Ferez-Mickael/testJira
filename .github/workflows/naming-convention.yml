name: "Jira Naming Enforcer (Branch, PR, Commits)"

on:
  push:
    branches-ignore:
      - main
      - master
      - develop
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  enforce-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 1. VALIDATE BRANCH NAME
      # Format: PROJ-123/feat-addLoginPage
      # ------------------------------------------------------------------
      - name: 1. Validate Branch Name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking Branch Name: $BRANCH_NAME"
          
          REGEX="^[A-Z0-9]+-[0-9]+\/(feat|fix|chore)-.+$"
          
          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "::error::Branch name '$BRANCH_NAME' is invalid."
            echo "Expected format: <ISSUE-ID>/<keyword>-<description>"
            echo "Example: PROJ-123/feat-addLoginPage"
            exit 1
          fi
          echo "✅ Branch Name is valid!"

      # ------------------------------------------------------------------
      # 2. VALIDATE PULL REQUEST TITLE
      # Format: PROJ-123/feat: add login page (Forced lowercase start)
      # ------------------------------------------------------------------
      - name: 2. Validate PR Title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR Title: $PR_TITLE"
          
          REGEX="^[A-Z0-9]+-[0-9]+\/(feat|fix|chore): [a-z].+$"
          
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "::error::PR Title '$PR_TITLE' is invalid."
            echo "Expected format: <ISSUE-ID>/<keyword>: <lowercase description>"
            echo "Example: PROJ-123/feat: add login page"
            exit 1
          fi
          echo "✅ PR Title is valid!"

      # ------------------------------------------------------------------
      # 3. VALIDATE ALL COMMIT MESSAGES
      # Format: PROJ-123/fix: add login timeout loop (Forced lowercase start)
      # ------------------------------------------------------------------
      - name: 3. Validate All Commit Messages
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking all commits in this Pull Request..."
          
          COMMITS=$(git log --no-merges --format=%s ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          
          if [[ -z "$COMMITS" ]]; then
            echo "✅ No new commits found to validate."
            exit 0
          fi
          
          REGEX="^[A-Z0-9]+-[0-9]+\/(feat|fix|chore): [a-z].+$"
          
          while IFS= read -r commit; do
            if [[ -z "$commit" ]]; then continue; fi
            echo "Checking commit: $commit"
            
            if [[ ! "$commit" =~ $REGEX ]]; then
              echo "::error::Commit message '$commit' is invalid."
              echo "Expected format: '<ISSUE-ID>/<keyword>: <lowercase description>'"
              echo "Example: PROJ-123/fix: add login timeout loop"
              exit 1
            fi
          done <<< "$COMMITS"
          
          echo "✅ All commit messages are valid!"

      # ------------------------------------------------------------------
      # 4. VALIDATE DESCRIPTION BULLET FORMAT
      # Requires bullet points starting with '-' under "What is changing?"
      # ------------------------------------------------------------------
      - name: 4. Validate PR Description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR Description..."
          
          if [[ ! "$PR_BODY" =~ "What is changing?" ]]; then
            echo "::error::PR Description missing 'What is changing?' section."
            exit 1
          fi
          
          if [[ ! "$PR_BODY" =~ -[[:space:]]+.+ ]]; then
            echo "::error::Each modification under 'What is changing?' must start with '- '"
            echo "Example:"
            echo "- Added a disabled state during submission"
            echo "- Prevent duplicate API calls."
            exit 1
          fi
          
          echo "✅ PR Description format is valid!"
