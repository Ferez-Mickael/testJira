name: Verify Naming Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  enforce-conventions:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

        - name: 🛠️ Step 1: Auto-Fix PR Title (Match Branch Name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          
          echo "Branch name is: $BRANCH_NAME"
          echo "Overwriting GitHub's default PR title to match the branch name..."
          
          gh pr edit "$PR_NUMBER" --title "$BRANCH_NAME"

        - name: ✅ Step 2: Validate the Naming Convention
        run: |
          TARGET_NAME="${{ github.head_ref }}"
          REGEX="^[A-Z0-9]+-[0-9]+/(feat|fix|chore)"
          
          echo "Checking name: $TARGET_NAME"
          
          if [[ ! "$TARGET_NAME" =~ $REGEX ]]; then
            echo "❌ ERROR: The Branch/PR Name '$TARGET_NAME' is invalid."
            echo "It must follow the format: [TICKET-ID]/[TYPE]"
            echo "Example: PROJ-123/feat"
            exit 1
          fi
          
          echo "✅ Naming convention passed!"

      - name: 📝 Step 3: Validate All Commit Messages
        run: |
          REGEX="^[A-Z0-9]+-[0-9]+/(feat|fix|chore)"
          COMMITS=$(git log --format=%s origin/${{ github.base_ref }}..origin/${{ github.head_ref }})
          
          echo "Checking commit messages..."
          
          while IFS= read -r COMMIT_MSG; do
            if [ -z "$COMMIT_MSG" ]; then
              continue
            fi
            
            echo "Evaluating: $COMMIT_MSG"
            
            if [[ ! "$COMMIT_MSG" =~ $REGEX ]]; then
              echo "❌ ERROR: Commit message '$COMMIT_MSG' is invalid."
              echo "It must follow the format: [TICKET-ID]/[TYPE]"
              echo "Example: PROJ-123/feat"
              exit 1
            fi
          done <<< "$COMMITS"
          
          echo "✅ All commit messages passed!"
