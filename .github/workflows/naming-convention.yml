name: Verify Naming Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    
    # ⚠️ CRITICAL: The Action needs this exact permission to successfully edit the PR Title
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Step 1: Auto-Fix PR Title (Match Branch Name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the actual branch name (e.g., PROJ-123/feat)
          BRANCH_NAME="${{ github.head_ref }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          
          echo "Branch name is: $BRANCH_NAME"
          echo "Overwriting GitHub's default PR title to match the branch name..."
          
          # Use GitHub CLI to instantly rename the PR
          gh pr edit "$PR_NUMBER" --title "$BRANCH_NAME"

      - name: ✅ Step 2: Validate the Naming Convention
        run: |
          # We check the branch name here, because we just forced the PR title to be exactly the same!
          TARGET_NAME="${{ github.head_ref }}"
          
          # Your required naming convention regex
          REGEX="^[A-Z0-9]+-[0-9]+/(feat|fix|chore)"
          
          echo "Checking name: $TARGET_NAME"
          
          if [[ ! "$TARGET_NAME" =~ $REGEX ]]; then
            echo "❌ ERROR: The Branch/PR Name '$TARGET_NAME' is invalid."
            echo "It must follow the format: [TICKET-ID]/[TYPE]"
            echo "Example: PROJ-123/feat"
            exit 1
          fi
          
          echo "✅ Naming convention passed!"
